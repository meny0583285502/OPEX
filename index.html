<style>

html,body{margin:0;background:var(--bg)}
body{font-family:Assistant,system-ui,sans-serif;color:var(--text);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}

.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.htop{display:flex;align-items:center;gap:8px}
.htop .t{flex:1;font-weight:700;font-size:17px;opacity:.95}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}

.bal{font-size:42px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.bal-sub{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.bal-sub div{opacity:.9}.bal-sub b{display:block;font-size:17px;font-weight:700}

.months{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none;margin:0 -16px}
.months::-webkit-scrollbar{display:none}
.mt{flex:none;border:0;background:var(--card);border-radius:999px;padding:8px 15px;font-weight:600;cursor:pointer;color:var(--muted)}

.ck .btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:600}
.tag.ok{background:#DDF2E8;color:#0B6B47}.tag.no{background:#FBE3DF;color:#A72B1F}.tag.gr{background:#EEF1EF;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}.kv b{font-weight:700;white-space:nowrap}
.bigmaa{font-size:38px;font-weight:800;color:var(--maa)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn.soft{background:var(--brand-soft);color:var(--brand)}.btn.red{background:#FBE3DF;color:#A72B1F}.btn.maa{background:var(--maa);color:#fff}

.btn:disabled{opacity:.55}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
label.f{display:block;font-size:13px;color:var(--muted);margin:13px 0 5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.filters>*{flex:1;min-width:120px}
nav.bn{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.bn .in{max-width:760px;margin:0 auto;display:flex}
nav.bn button{flex:1;min-width:0;border:0;background:none;padding:8px 0 9px;color:var(--muted);font-size:11.5px;white-space:nowrap;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bn svg{width:22px;height:22px}
nav.bn button.on{color:var(--brand);font-weight:700}
.badge{position:absolute;top:3px;left:calc(50% - 22px);background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;font-weight:700}
.mbg{position:fixed;inset:0;background:rgba(14,22,48,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.mbg{align-items:center}}
.modal{background:var(--bg);width:100%;max-width:520px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:0 0 20px}
@media(min-width:700px){.modal{border-radius:24px}}
.mh{background:var(--card);padding:14px 16px 16px;border-radius:24px 24px 0 0;position:sticky;top:0;z-index:1}
.mh .r1{display:flex;justify-content:space-between;align-items:center}
.mh h3{margin:0;font-size:18px}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-top:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amt{font-size:40px;font-weight:800;text-align:center;border:0;background:none;padding:8px 0 0;direction:ltr}
.amt:focus{outline:none;border:0}
.mbd{padding:6px 16px}
.cg{font-size:12.5px;color:var(--muted);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.note{background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:9px 12px;font-size:13.5px;margin-top:10px}
.sugg{font-size:12.5px;color:var(--brand);min-height:16px;margin-top:6px}
.heb{font-size:12.5px;color:var(--brand);margin-top:4px}
.rbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rbox img{max-height:70px;border-radius:10px}
.check{display:flex;align-items:center;gap:9px;margin-top:13px;font-size:14.5px}.check input{width:20px;height:20px}
.mfoot{display:flex;gap:8px;margin-top:18px}.mfoot .btn{flex:1}.mfoot .btn.red{flex:none}
.hidden{display:none!important}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#141A2E;color:#fff;padding:10px 18px;border-radius:999px;z-index:40;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.login{max-width:360px;margin:0 auto;padding:22vh 20px 0;text-align:center}
.login h1{color:var(--brand);font-size:30px}
.ed{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.ed input{padding:8px 10px}.ed .ic{text-align:center;font-size:18px;padding:8px 0}
.ob{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ob:last-child{border:0}
.ob .n{font-weight:600}.ob .a{font-weight:700;font-size:16px}.ob .s{font-size:12.5px;color:var(--muted)}
.totals{display:flex;gap:20px;flex-wrap:wrap}.totals div{font-size:13px;color:var(--muted)}.totals b{display:block;font-size:20px;color:var(--text)}
.viewer img{max-width:100%;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
// ======== הגדרה ========
const API = 'https://opex.meny85502.workers.dev';
const BRIDGE = 'http://127.0.0.1:17345'; // הגשר שרץ על המחשב (עדכון מהבנק)
// =======================

const PAY_METHODS = ['מזומן', 'אשראי', 'העברה', 'הוראת קבע', "צ'ק"];
const TYPE_LABEL = { expense: 'הוצאה', income: 'הכנסה', maaser: 'מעשרות' };
const GROUPS = ['קבועות', 'שוטפות', 'חד פעמיות'];
const GCOL = { 'קבועות': '#2D6CDF', 'שוטפות': '#0E8A5F', 'חד פעמיות': '#C77700' };
const CARD_SOURCES = ['visaCal', 'max', 'isracard', 'amex'];
const SRC_NAME = { leumi: 'לאומי', hapoalim: 'הפועלים', discount: 'דיסקונט', mizrahi: 'מזרחי', visaCal: 'כאל', max: 'מקס', isracard: 'ישראכרט', amex: 'אמקס', beinleumi: 'הבינלאומי', mercantile: 'מרכנתיל' };
const S = { token: lsGet('kb_token'), boot: null, hy: null, txs: [], bank: [], maaser: null, view: lsGet('kb_view') || 'home', month: null, filter: { type: '', cat: '', month: '', q: '' } };

function lsGet(k) { try { return localStorage.getItem(k) } catch { return null } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const fmt0 = n => Math.round(+n || 0).toLocaleString('he-IL');
const M = n => `<span class="num">${n < 0 ? '−' : ''}₪${fmt(Math.abs(n || 0))}</span>`;
const M0 = n => `<span class="num">${Math.round(n || 0) < 0 ? '−' : ''}₪${fmt0(Math.abs(n || 0))}</span>`;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 3200); }

async function api(path, opts = {}) {
  const r = await fetch(API + path, { method: opts.method || 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (S.token || '') }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/login') { S.token = null; lsSet('kb_token', null); render(); throw new Error('צריך להתחבר מחדש'); }
  if (!r.ok) throw new Error(d.error || 'שגיאה');
  return d;
}

// ---------- תאריך עברי ----------
const isoToDate = s => new Date(s + 'T12:00:00');
const dateToIso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayIso = () => dateToIso(new Date());
const fEn = new Intl.DateTimeFormat('en-u-ca-hebrew', { year: 'numeric', month: 'long', day: 'numeric' });
const fHeM = new Intl.DateTimeFormat('he-u-ca-hebrew', { month: 'long' });
function hparts(iso) { const p = {}; fEn.formatToParts(isoToDate(iso)).forEach(x => p[x.type] = x.value); return { y: +p.year, m: p.month, d: +p.day }; }
function gem(n) {
  const u = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'], t = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'], h = ['', 'ק', 'ר', 'ש', 'ת'];
  let s = ''; n = n % 1000;
  while (n >= 400) { s += 'ת'; n -= 400; }
  s += h[Math.floor(n / 100)]; n %= 100;
  if (n === 15) s += 'טו'; else if (n === 16) s += 'טז'; else s += t[Math.floor(n / 10)] + u[n % 10];
  return s.length > 1 ? s.slice(0, -1) + '״' + s.slice(-1) : s + '׳';
}
const hMonth = iso => fHeM.format(isoToDate(iso));
const hDate = iso => gem(hparts(iso).d) + ' ' + hMonth(iso);
const gDate = iso => { const [, m, d] = iso.split('-'); return `${+d}.${+m}`; };
const WD = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
function roshHashana(y) { const d = new Date(y - 3761, 8, 1, 12); for (let i = 0; i < 45; i++) { const p = hparts(dateToIso(d)); if (p.m === 'Tishri' && p.d === 1) return dateToIso(d); d.setDate(d.getDate() + 1); } }
function yearRange(y) { const a = roshHashana(y), b = isoToDate(roshHashana(y + 1)); b.setDate(b.getDate() - 1); return [a, dateToIso(b)]; }
const _ym = {};
function yearMonths(y) {
  if (_ym[y]) return _ym[y];
  const [a, b] = yearRange(y), out = []; const d = isoToDate(a), end = isoToDate(b);
  while (d <= end) { const n = hMonth(dateToIso(d)); if (!out.includes(n)) out.push(n); d.setDate(d.getDate() + 1); }
  return (_ym[y] = out);
}

// ---------- טעינה ----------
async function loadBoot() { S.boot = await api('/api/bootstrap'); buildDescMap(); }
async function loadYear() {
  const [a, b] = yearRange(S.hy);
  const [t, m, bk] = await Promise.all([api(`/api/tx?from=${a}&to=${b}`), api('/api/maaser'), api(`/api/bank?from=${a}&to=${b}`)]);
  S.txs = t.items; S.maaser = m; S.bank = bk.items;
  try { S.flagged = (await api('/api/tx?flagged=1')).items; } catch { S.flagged = S.txs.filter(x => x.flag); }
  BANK_BY_ID = {}; S.bank.forEach(b => BANK_BY_ID[b.id] = b);
}
let BANK_BY_ID = {};
async function reloadAll() {
  await loadBoot();
  if (S.boot.pending > 0) { try { await api('/api/bank/process', { method: 'POST' }); await loadBoot(); } catch (e) {} }
  await loadYear(); render();
}
const cats = type => (S.boot?.categories || []).filter(c => c.type === type);
const catById = id => (S.boot?.categories || []).find(c => c.id === id);

// ---------- הצעות ----------
let DESC = {};
function buildDescMap() { DESC = {}; (S.boot.descriptions || []).forEach(d => { const k = d.type + '|' + d.description; if (!DESC[k] && d.category_id) DESC[k] = d.category_id; }); }
function suggest(text, type) {
  if (!text) return null;
  if (DESC[type + '|' + text.trim()]) return DESC[type + '|' + text.trim()];
  const s = text.toLowerCase(); let best = null, len = 0;
  cats(type).filter(c => c.active && c.keywords).forEach(c => c.keywords.split(',').forEach(k => { k = k.trim().toLowerCase(); if (k && k.length > len && s.includes(k)) { best = c.id; len = k.length; } }));
  return best;
}

// ---------- חישובים ----------
function sums(list) { const r = { income: 0, expense: 0, maaser: 0, liable: 0 }; list.forEach(t => { if (t.flag) return; r[t.type] += t.amount; if (t.type === 'income' && t.maaser_liable) r.liable += t.amount; }); return r; }
const inMonth = (list, m) => list.filter(t => hMonth(t.date) === m);
function bankBalance() {
  const all = (S.boot.accounts || []).filter(a => !CARD_SOURCES.includes(a.source));
  const accs = all.filter(a => !a.savings), sav = all.filter(a => a.savings);
  if (!accs.length) return null;
  const upcoming = (S.boot.upcoming || []).reduce((a, u) => a + u.s, 0);
  const total = accs.reduce((a, x) => a + x.balance, 0);
  return { total, upcoming, after: total + upcoming, savings: sav.reduce((a, x) => a + x.balance, 0), hasSav: sav.length > 0, upd: accs.map(a => a.updated_at).sort().pop() };
}
function ago(iso) { const min = Math.round((Date.now() - new Date(iso)) / 6e4); if (min < 2) return 'עכשיו'; if (min < 60) return `לפני ${min} דקות`; const h = Math.round(min / 60); if (h < 24) return `לפני ${h} שעות`; return `לפני ${Math.round(h / 24)} ימים`; }

// ---------- מסגרת ----------
function render() {
  const root = $('#root');
  if (!S.token) { root.innerHTML = loginHTML(); $('#pw').focus(); return; }
  if (!S.boot) { root.innerHTML = '<div class="login"><h1>כספי הבית</h1><p class="muted">טוען…</p></div>'; return; }
  const ms = yearMonths(S.hy);
  if (!S.month || !ms.includes(S.month)) { const cur = hMonth(todayIso()); S.month = ms.includes(cur) && hparts(todayIso()).y === S.hy ? cur : ms[0]; }
  const views = { home: homeHTML, month: monthViewHTML, income: incomeViewHTML, reports: reportsHTML, list: listHTML, maaser: maaserHTML, check: checkHTML, obl: oblHTML, settings: settingsHTML };
  const v = views[S.view] ? S.view : 'home';

function cardMatch(bill) {
  const cands = S.bank.filter(b => CARD_SOURCES.includes(b.source) && b.processed_date && Math.abs((isoToDate(b.processed_date) - isoToDate(bill.date)) / 864e5) <= 3);
  const by = {}; cands.forEach(b => { const k = b.source + '|' + b.account; by[k] = (by[k] || 0) - b.amount; });
  let best = null; Object.entries(by).forEach(([k, v]) => { const d = Math.abs(v + bill.amount); if (!best || d < best.d) best = { k, v, d }; });
  return best;
}

function remainingNow(r, onIso) {
  if (r.remaining == null) return null;
  const a = isoToDate(r.as_of), b = isoToDate(onIso || todayIso()); let n = 0;
  for (let d = new Date(a.getFullYear(), a.getMonth(), 1, 12); d <= b; d.setMonth(d.getMonth() + 1)) {
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); const pay = new Date(d.getFullYear(), d.getMonth(), Math.min(r.day || 1, last), 12);
    if (pay > a && pay <= b) n++;
  }
  return Math.max(0, r.remaining - n);
}

  const b = { kind: R.kind, name: $('#rN').value, amount: +$('#rA').value, day: +$('#rD').value || 1, remaining: $('#rR').value, balance: $('#rB').value, category_id: +$('#rC').value || null, payment_method: R.payment_method || 'הוראת קבע', note: $('#rT').value, as_of: todayIso(), active: 1 };
  if (!b.name || !b.amount) return toast('צריך שם וסכום');
  try { if (R.id) await api('/api/recurring/' + R.id, { method: 'PUT', body: b }); else await api('/api/recurring', { method: 'POST', body: b }); closeModal(); await loadBoot(); render(); toast('נשמר'); } catch (e) { toast(e.message); }
}
async function delRec() { if (!confirm('למחוק?')) return; try { await api('/api/recurring/' + R.id, { method: 'DELETE' }); closeModal(); await loadBoot(); render(); } catch (e) { toast(e.message); } }

// ---------- הגדרות ----------
function settingsHTML() {
  const st = S.boot.settings;
  const block = type => cats(type).filter(c => c.active).map(c => `<div class="ed"><input class="ic" value="${esc(c.icon || '')}" onchange="catUpd(${c.id},{icon:this.value})" aria-label="אייקון">
      <div><input value="${esc(c.name)}" onchange="catUpd(${c.id},{name:this.value})"><div style="display:flex;gap:6px;margin-top:5px">
        ${type === 'expense' ? `<select style="padding:6px;width:auto" onchange="catUpd(${c.id},{grp:this.value})">${GROUPS.map(g => `<option ${c.grp === g ? 'selected' : ''}>${g}</option>`).join('')}</select>`
          : `<label class="check" style="margin:0;font-size:13px;white-space:nowrap"><input type="checkbox" ${c.maaser_liable ? 'checked' : ''} onchange="catUpd(${c.id},{maaser_liable:this.checked?1:0})">חייב במעשר</label>`}
        <input style="padding:6px 9px;font-size:13px" placeholder="מילים לזיהוי אוטומטי, בפסיקים" value="${esc(c.keywords || '')}" onchange="catUpd(${c.id},{keywords:this.value})"></div></div>
      <button class="btn sm red" onclick="catDel(${c.id})">מחק</button></div>`).join('');
  return `<div class="panel"><div class="ph"><h2>מעשרות</h2></div>
    <label class="f">אחוז</label><input id="sPct" type="number" step="0.5" value="${esc(st.maaser_percent)}">
    <label class="f">חוב מעשרות מלפני תאריך הפתיחה (מינוס אם נתת יותר)</label><input id="sOpen" type="number" step="0.01" value="${esc(st.maaser_opening)}">
    <label class="f">תאריך פתיחה למעשרות</label><input id="sDate" type="date" value="${esc(st.maaser_opening_date)}">
    <label class="f">נמענים שהעברה אליהם נרשמת תמיד כמעשרות (מופרדים בפסיק)</label><input id="sNames" value="${esc(st.maaser_names ?? 'הורים')}" placeholder="הורים">
    <p class="muted" style="margin:4px 0 0">כל שאר התרומות מהבנק ומהאשראי נרשמות כהוצאה "תרומות וצדקה" ולא יורדות מהמעשרות. מעשרות רושמים ידנית. אם תשנה תרומה מסוימת למעשרות, התוכנה תזכור את הנמען להבא.</p>
    <label class="f">תנועות מהבנק ומהאשראי נכנסות מהתאריך</label><input id="sBank" type="date" value="${esc(st.bank_start || '2026-09-12')}">
    <button class="btn" style="margin-top:12px" onclick="saveSettings()">שמירה</button></div>
  <div class="panel"><div class="ph"><h2>קטגוריות הוצאות</h2></div>${block('expense')}<div style="display:flex;gap:8px;margin-top:10px"><input id="newExp" placeholder="קטגוריה חדשה"><button class="btn sm" onclick="catAdd('expense','newExp')">הוספה</button></div></div>
  <div class="panel"><div class="ph"><h2>קטגוריות הכנסות</h2></div>${block('income')}<div style="display:flex;gap:8px;margin-top:10px"><input id="newInc" placeholder="קטגוריה חדשה"><button class="btn sm" onclick="catAdd('income','newInc')">הוספה</button></div></div>
  <div class="panel"><div class="ph"><h2>גיבוי וייבוא</h2></div><button class="btn soft" onclick="exportAll()">הורדת גיבוי</button>
    <label class="f">ייבוא מקובץ</label><input type="file" accept=".json" onchange="importFile(this)"><p class="muted">רישום שכבר מגיע מהבנק או מהאשראי לא ייכנס פעמיים.</p></div>
  <button class="btn red" style="width:100%" onclick="logout()">יציאה</button>
  <p class="muted" style="text-align:center">גרסה ${APP_VERSION}</p>`;
}
async function catAdd(type, inp) { const n = $('#' + inp).value.trim(); if (!n) return; try { await api('/api/categories', { method: 'POST', body: { type, name: n } }); await loadBoot(); render(); } catch (e) { toast(e.message); } }
async function catUpd(id, b) { try { await api('/api/categories/' + id, { method: 'PUT', body: b }); await loadBoot(); toast('נשמר'); } catch (e) { toast(e.message); } }
async function catDel(id) { if (!confirm('למחוק את הקטגוריה?')) return; try { await api('/api/categories/' + id, { method: 'DELETE' }); await loadBoot(); render(); } catch (e) { toast(e.message); } }
async function saveSettings() { try { await api('/api/settings', { method: 'PUT', body: { maaser_percent: $('#sPct').value, maaser_opening: $('#sOpen').value, maaser_opening_date: $('#sDate').value, bank_start: $('#sBank').value, maaser_names: $('#sNames').value } }); await reloadAll(); toast('נשמר'); } catch (e) { toast(e.message); } }
async function exportAll() { try { const d = await api('/api/export'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 1)], { type: 'application/json' })); a.download = 'kaspei-bayit-' + todayIso() + '.json'; a.click(); } catch (e) { toast(e.message); } }
async function importFile(inp) { const f = inp.files[0]; if (!f) return; if (!confirm('לייבא את ' + f.name + '?')) return; try { const r = await api('/api/import', { method: 'POST', body: JSON.parse(await f.text()) }); toast(`יובאו ${r.transactions} רישומים${r.merged ? `, ${r.merged} מהם כבר הגיעו מהבנק וקושרו` : ''}`); await reloadAll(); } catch (e) { toast('שגיאה: ' + e.message); } inp.value = ''; }
function logout() { S.token = null; lsSet('kb_token', null); S.boot = null; render(); }

// ---------- חלון ----------
function modal(html) { let bg = $('#mbg'); if (!bg) { bg = document.createElement('div'); bg.id = 'mbg'; bg.className = 'mbg'; bg.onclick = e => { if (e.target === bg) closeModal(); }; document.body.appendChild(bg); } bg.innerHTML = `<div class="modal" role="dialog">${html}</div>`; }
function closeModal() { $('#mbg')?.remove(); F = null; R = null; }

// ---------- טופס ----------
let F = null;
function openTx(arg) {
  const t = typeof arg === 'number' ? S.txs.find(x => x.id === arg) : null;
  F = t ? { ...t, receipt: null, removeReceipt: false, catTouched: true }
    : { id: null, date: todayIso(), amount: '', category_id: null, description: '', payment_method: '', note: '', maaser_liable: 1, has_receipt: 0, receipt: null, catTouched: false, ...arg };
  drawForm();
}
function catChips() {
  if (F.type === 'maaser') return '';
  const list = cats(F.type).filter(c => c.active || c.id === F.category_id);
  const chip = c => `<button class="chip ${F.category_id === c.id ? 'on' : ''}" onclick="pickCat(${c.id})">${c.icon || ''} ${esc(c.name)}</button>`;
  if (F.type === 'income') return `<div class="chips">${list.map(chip).join('')}</div>`;
  return GROUPS.map(g => { const l = list.filter(c => (c.grp || 'שוטפות') === g); return l.length ? `<div class="cg">${g}</div><div class="chips">${l.map(chip).join('')}</div>` : ''; }).join('');
}
function drawForm() {
  const fromBank = F.id && F.source === 'bank';
  const seen = new Set();
  const descs = (S.boot.descriptions || []).filter(d => d.type === F.type && !seen.has(d.description) && seen.add(d.description)).map(d => `<option value="${esc(d.description)}">`).join('');
  modal(`<div class="mh"><div class="r1"><h3>${F.id ? (fromBank ? 'תנועה מהבנק / האשראי' : 'עריכה') : 'רישום חדש'}</h3><button class="x" onclick="closeModal()" aria-label="סגירה">×</button></div>
      <div class="seg">${['expense', 'income', 'maaser'].map(t => `<button class="${F.type === t ? 'on' : ''}" onclick="setType('${t}')">${TYPE_LABEL[t]}</button>`).join('')}</div>
      <input class="amt" id="fAmount" type="number" inputmode="decimal" step="0.01" placeholder="₪0" value="${esc(F.amount)}" oninput="F.amount=this.value" style="width:100%"></div>
    <div class="mbd">
      ${fromBank ? `<div class="note">הגיע אוטומטית. אם תשנה קטגוריה, התוכנה תזכור ותעדכן גם תנועות דומות.</div>` : ''}
      <label class="f">${F.type === 'maaser' ? 'למי' : F.type === 'income' ? 'ממי' : 'על מה'}</label>
      <input id="fDesc" list="dl" value="${esc(F.description)}" oninput="descInput(this.value)" autocomplete="off"><datalist id="dl">${descs}</datalist>
      <div id="catBox">${F.type !== 'maaser' ? `<div class="sugg" id="sugg"></div>${catChips()}` : ''}</div>
      <label class="f">תאריך</label><input type="date" value="${esc(F.date)}" onchange="F.date=this.value;$('#fHeb').textContent=hDate(this.value)+' '+gem(hparts(this.value).y)">
      <div class="heb" id="fHeb">${esc(hDate(F.date))} ${gem(hparts(F.date).y)}</div>
      <label class="f">אמצעי תשלום</label><div class="chips">${PAY_METHODS.map(p => `<button class="chip ${F.payment_method === p ? 'on' : ''}" onclick="setPay(this,'${p.replace(/'/g, "\\'")}')">${esc(p)}</button>`).join('')}</div>
      ${F.type === 'income' ? `<label class="check"><input type="checkbox" id="fLiable" ${F.maaser_liable ? 'checked' : ''} onchange="F.maaser_liable=this.checked?1:0"> חייב במעשר</label>` : ''}
      <label class="f">שיוך</label><div class="chips" id="flagChips">${[['', 'רגיל'], ['lent', 'מישהו חייב לי'], ['held', 'כסף שאני מחזיק עבור מישהו']].map(([v, l]) => `<button class="chip ${(F.flag || '') === v ? 'on' : ''}" onclick="setFlag('${v}')">${l}</button>`).join('')}</div>
      <div id="flagBox" class="${F.flag ? '' : 'hidden'}"><label class="f">${F.flag === 'held' ? 'עבור מי' : 'מי'}</label><input id="fParty" list="partyList" value="${esc(F.party || '')}" oninput="F.party=this.value" placeholder="למשל אנגלרד, שמעון">
        <datalist id="partyList">${[...new Set((S.flagged || []).map(x => x.party).filter(Boolean))].map(p => `<option value="${esc(p)}">`).join('')}</datalist>
        <div class="muted" style="margin-top:6px">${F.flag === 'lent' ? 'לא נספר בהוצאות ובהכנסות. כשהוא מחזיר, סמן גם את ההחזר "מישהו חייב לי" עם אותו שם, והחוב ייסגר.' : 'לא נספר בהכנסות ובמעשרות. כשתעביר לו את הכסף, סמן גם את ההעברה בשיוך הזה עם אותו שם.'}</div></div>
      <label class="f">הערה</label><textarea rows="2" oninput="F.note=this.value" placeholder="למשל: עבור קו השיעורים">${esc(F.note)}</textarea>
      <label class="f">קבלה</label><div class="rbox" id="rbox">${receiptBox()}</div>
      <div class="mfoot"><button class="btn ${F.type === 'maaser' ? 'maa' : ''}" id="fSave" onclick="saveTx()">שמירה</button>${F.id ? `<button class="btn red" onclick="delTx()">${fromBank ? 'לא לספור' : 'מחיקה'}</button>` : ''}</div>
    </div>`);
  if (!F.id && !F.amount) setTimeout(() => $('#fAmount')?.focus(), 60);
}
function setFlag(v) { keep(); F.flag = v; if (v && !F.party) F.party = ''; drawForm(); }
function keep() { F.amount = $('#fAmount')?.value ?? F.amount; F.description = $('#fDesc')?.value ?? F.description; }
function setType(t) { keep(); if (t === F.type) return; F.type = t; F.category_id = t === 'maaser' ? null : suggest(F.description, t); if (!F.id) F.catTouched = false; drawForm(); }
function pickCat(id) { F.category_id = id; F.catTouched = true; if (F.type === 'income' && !F.id) { F.maaser_liable = catById(id)?.maaser_liable ?? 1; const l = $('#fLiable'); if (l) l.checked = !!F.maaser_liable; } redrawCats(); }
function redrawCats() { const box = $('#catBox'); if (box) box.innerHTML = `<div class="sugg" id="sugg"></div>` + catChips(); }
function descInput(v) { F.description = v; if (F.catTouched || F.type === 'maaser') return; const s = suggest(v, F.type); if (s !== F.category_id) { F.category_id = s; redrawCats(); $('#sugg').textContent = s ? 'הוצע לפי השם' : ''; } }
function setPay(el, p) { F.payment_method = F.payment_method === p ? '' : p; el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el && !!F.payment_method)); }
function receiptBox() {
  if (F.receipt) return `${F.receipt.mime.startsWith('image/') ? `<img src="data:${F.receipt.mime};base64,${F.receipt.data}" alt="">` : `<span>📄 ${esc(F.receipt.name)}</span>`}<button class="btn sm red" onclick="F.receipt=null;$('#rbox').innerHTML=receiptBox()">הסרה</button>`;
  if (F.has_receipt && !F.removeReceipt) return `<button class="btn sm soft" onclick="viewReceipt(${F.id})">📎 הצגת הקבלה</button><button class="btn sm red" onclick="F.removeReceipt=true;$('#rbox').innerHTML=receiptBox()">מחיקת קבלה</button>${pickers()}`;
  return pickers();
}
function pickers() { return `<label class="btn sm soft">📷 צילום<input type="file" accept="image/*" capture="environment" class="hidden" onchange="pickReceipt(this)"></label><label class="btn sm soft">📁 קובץ<input type="file" accept="image/*,application/pdf" class="hidden" onchange="pickReceipt(this)"></label>`; }
async function pickReceipt(inp) { const f = inp.files[0]; if (!f) return; try { if (f.type.startsWith('image/')) F.receipt = await compressImage(f); else { if (f.size > 4.4e6) return toast('ה-PDF גדול מ-4MB'); F.receipt = { mime: f.type || 'application/pdf', name: f.name, data: await b64(f) }; } $('#rbox').innerHTML = receiptBox(); } catch (e) { toast('לא הצלחתי לקרוא את הקובץ'); } }
function b64(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); }); }
async function compressImage(file) { const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); const sc = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.72)); return { mime: 'image/jpeg', name: file.name.replace(/\.\w+$/, '') + '.jpg', data: await b64(blob) }; }
async function saveTx() {
  keep();
  if (!(+F.amount > 0)) return toast('חסר סכום');
  if (F.type !== 'maaser' && !F.category_id) return toast('בחר קטגוריה');
  const btn = $('#fSave'); btn.disabled = true; btn.textContent = 'שומר…';
  const body = { type: F.type, date: F.date, amount: +F.amount, category_id: F.type === 'maaser' ? null : F.category_id, description: F.description, payment_method: F.payment_method, note: F.note, maaser_liable: F.maaser_liable, flag: F.flag || '', party: F.flag ? (($('#fParty')?.value) ?? F.party ?? '') : '' };
  try {
    let id = F.id, msg = 'נשמר';
    if (id) { const r = await api('/api/tx/' + id, { method: 'PUT', body }); if (r.similar) msg = `נשמר, ועודכנו עוד ${r.similar} תנועות דומות`; }
    else { const r = await api('/api/tx', { method: 'POST', body }); id = r.id; if (r.merged === 'bank') msg = 'זה כבר הגיע מהבנק או מהאשראי. נשארו נתוני הבנק עם הקטגוריה שבחרת'; else if (r.merged === 'manual') msg = 'נשמר וקושר לתנועה בבנק'; }
    if (F.receipt) await api('/api/receipt/' + id, { method: 'POST', body: F.receipt }); else if (F.removeReceipt) await api('/api/receipt/' + id, { method: 'DELETE' });
    closeModal(); toast(msg); await reloadAll();
  } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = 'שמירה'; }
}
async function delTx() { const fb = F.source === 'bank'; if (!confirm(fb ? 'לא לספור את התנועה הזו? אפשר להחזיר אותה במסך הבדיקה.' : 'למחוק את הרישום?')) return; try { await api('/api/tx/' + F.id, { method: 'DELETE' }); closeModal(); toast(fb ? 'התנועה לא תיספר' : 'נמחק'); await reloadAll(); } catch (e) { toast(e.message); } }
async function viewReceipt(id) {
  try { toast('טוען קבלה…'); const r = await api('/api/receipt/' + id); const bin = atob(r.data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u], { type: r.mime }));
    if (r.mime.startsWith('image/')) { const v = document.createElement('div'); v.className = 'mbg'; v.style.zIndex = 30; v.onclick = () => v.remove(); v.innerHTML = `<div class="modal viewer" style="padding:16px"><img src="${url}" alt="קבלה"><a class="btn sm soft" style="display:inline-block;margin-top:10px;text-decoration:none" href="${url}" download="${esc(r.name || 'receipt.jpg')}">הורדה</a></div>`; document.body.appendChild(v); }
    else window.open(url, '_blank');
  } catch (e) { toast(e.message); }
}

// ---------- הפעלה ----------
S.hy = hparts(todayIso()).y;
render();
if (S.token) reloadAll().catch(e => toast(e.message));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
