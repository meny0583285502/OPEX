<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כספי הבית</title>
<meta name="theme-color" content="#1B2463">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2463; --ink-deep:#10164A; --ink-soft:#2C3A8C;
  --sheet:#F4F5FA; --paper:#FFFFFF; --text:#151A3D; --muted:#5F6587; --line:#E2E4F0;
  --exp:#E5482F; --inc:#0FA36B; --maa:#F5A400; --maa-ink:#8A5B00;
  --g-fixed:#3554D1; --g-run:#E5482F; --g-once:#8E2C8A;
  --serif:'Frank Ruhl Libre',Georgia,serif; --sans:Rubik,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--text);font-size:16px;line-height:1.45;
  background:var(--ink-deep);
  background-image:
    radial-gradient(1200px 500px at 85% -10%, #3B4BC4 0%, transparent 60%),
    radial-gradient(900px 600px at -10% 10%, #0E6B6B 0%, transparent 55%),
    linear-gradient(180deg,var(--ink) 0%,var(--ink-deep) 70%);
  background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--maa);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ---------- hero (על הרקע הצבעוני) ---------- */
.hero{color:#fff;max-width:980px;margin:0 auto;padding:16px 18px 0}
.bar{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--serif);font-weight:700;font-size:21px;flex:1;letter-spacing:.2px}
.ibtn{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:20px;height:20px}
.ibtn.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.yearrow{display:flex;align-items:center;gap:14px;margin:18px 0 6px}
.yearrow button{background:none;border:0;color:rgba(255,255,255,.6);font-size:34px;cursor:pointer;line-height:1;padding:0 4px}
.yearrow button:hover{color:#fff}
.year{font-family:var(--serif);font-weight:900;font-size:clamp(64px,17vw,112px);line-height:.9;letter-spacing:-1px;
  color:transparent;-webkit-text-stroke:1.6px rgba(255,255,255,.9)}
.flows{display:flex;gap:0;margin:16px 0 26px;flex-wrap:wrap}
.flow{padding:0 16px;border-inline-start:1px solid rgba(255,255,255,.22)}
.flow:first-child{padding-inline-start:0;border:0}
.flow .k{font-size:13px;color:rgba(255,255,255,.7)}
.flow .v{font-family:var(--serif);font-weight:700;font-size:clamp(22px,5.6vw,30px);line-height:1.15}
.flow.in .v{color:#5BE3A8}.flow.out .v{color:#FF8A73}.flow.ma .v{color:var(--maa)}

/* ---------- the sheet ---------- */
.sheet{background:var(--sheet);border-radius:30px 30px 0 0;min-height:60vh;max-width:980px;margin:0 auto;padding:22px 18px 130px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.plain{margin-top:14px}
h2.sec{font-family:var(--serif);font-weight:700;font-size:22px;margin:30px 0 12px;display:flex;align-items:baseline;gap:10px}
h2.sec:first-child{margin-top:4px}
h2.sec small{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:400}
.muted{color:var(--muted);font-size:13.5px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:0;border-radius:999px;padding:12px 20px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:15px}
.pill.exp{background:var(--exp);color:#fff}.pill.inc{background:var(--inc);color:#fff}.pill.maa{background:var(--maa);color:#3A2600}
.pill.ink{background:var(--ink);color:#fff}.pill.ghost{background:#E3E6F5;color:var(--ink)}.pill.danger{background:#FCE3DE;color:#B42B16}
.pill.sm{padding:7px 13px;font-size:13.5px}
.pill:disabled{opacity:.55;cursor:default}

/* month ribbons */
.ribbons{display:flex;flex-direction:column;gap:12px}
.rib{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;cursor:pointer}
.rib .m{font-family:var(--serif);font-weight:700;font-size:17px}
.rib .track{height:14px;border-radius:7px;background:#E3E6F5;display:flex;overflow:hidden}
.rib .track span{height:100%}
.rib .t{font-weight:600;font-size:14.5px;min-width:72px;text-align:left}
.rib .sub{grid-column:2/4;font-size:12.5px;color:var(--muted);margin-top:-6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* category bars */
.cbar{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.cbar .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px}
.cbar .nm{font-size:14.5px}
.cbar .bk{height:6px;border-radius:3px;background:#E3E6F5;margin-top:4px;overflow:hidden}
.cbar .bk span{display:block;height:100%;border-radius:3px}
.cbar .a{font-weight:600;font-size:14.5px}

/* transactions timeline */
.tl{position:relative}
.mhead{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink);margin:18px 0 4px;display:flex;justify-content:space-between}
.mhead span{font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--muted)}
.tx{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;cursor:pointer;border-bottom:1px dashed var(--line)}
.tx:last-child{border-bottom:0}
.tx .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#fff}
.tx .d1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .d2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:700;font-size:15.5px}
.tx.expense .a{color:var(--exp)}.tx.income .a{color:var(--inc)}.tx.maaser .a{color:var(--maa-ink)}
.empty{color:var(--muted);text-align:center;padding:28px 0}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.filters>*{flex:1;min-width:130px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink-soft)}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}

/* maaser coin */
.coinwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.coin{width:150px;height:150px;flex:none}
.coin .big{font-family:var(--serif);font-weight:900}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv:last-child{border:0}.kv b{font-weight:600}

/* compare */
.cmp{display:grid;grid-template-columns:62px 1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.cmp .m{font-family:var(--serif);font-weight:700;grid-row:span 2}
.cmp .ln{height:9px;border-radius:5px}
.cmp .v{font-size:13px;text-align:left}
.gap{grid-column:2/4;font-size:12.5px}
.bk-row{padding:11px 0;border-bottom:1px dashed var(--line)}
.bk-row .top{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.bk-row .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.bk-row .act{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:500}
.tag.ok{background:#D7F3E6;color:#0B6B47}.tag.no{background:#FDE2DC;color:#B42B16}.tag.card{background:#E3E6F5;color:var(--ink)}
.bk-row.dim{opacity:.55}
.syncmsg{margin-top:10px;font-size:14px}
.ok-t{color:#0B6B47}.er-t{color:#B42B16}

/* obligations */
.ob{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.ob .n{font-weight:600}
.ob .a{font-family:var(--serif);font-weight:700;font-size:18px}
.ob .s{font-size:12.5px;color:var(--muted)}
.ob .prog{grid-column:1/3;height:6px;border-radius:3px;background:#E3E6F5;overflow:hidden;margin-top:6px}
.ob .prog span{display:block;height:100%;background:var(--ink-soft)}
.totals{display:flex;gap:22px;flex-wrap:wrap;margin:4px 0 6px}
.totals div{font-size:13px;color:var(--muted)}
.totals b{display:block;font-family:var(--serif);font-size:24px;color:var(--text)}

/* nav */
nav.bottom{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:10;
  background:var(--ink-deep);border-radius:999px;padding:6px;display:flex;gap:2px;box-shadow:0 10px 30px rgba(16,22,74,.45);width:min(560px,calc(100% - 24px))}
nav.bottom button{flex:1;border:0;background:none;color:rgba(255,255,255,.62);padding:8px 2px;border-radius:999px;cursor:pointer;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bottom svg{width:21px;height:21px}
nav.bottom button.on{background:rgba(255,255,255,.13);color:#fff}
.badge{position:absolute;top:2px;left:calc(50% - 22px);background:var(--exp);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px;font-weight:700}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:max(18px,calc(50% - 470px));width:60px;height:60px;border-radius:50%;border:0;background:var(--maa);color:#3A2600;font-size:32px;font-weight:300;box-shadow:0 8px 22px rgba(245,164,0,.45);cursor:pointer;z-index:9}

/* modal / form */
.mbg{position:fixed;inset:0;background:rgba(16,22,74,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.mbg{align-items:center}}
.modal{background:var(--sheet);width:100%;max-width:540px;max-height:94vh;overflow:auto;border-radius:26px 26px 0 0}
@media(min-width:700px){.modal{border-radius:26px}}
.mtop{padding:16px 18px 18px;color:#fff;position:sticky;top:0;z-index:1}
.mtop.expense{background:var(--exp)}.mtop.income{background:var(--inc)}.mtop.maaser{background:var(--maa);color:#3A2600}.mtop.ink{background:var(--ink)}
.mtop .row1{display:flex;justify-content:space-between;align-items:center}
.mtop h3{margin:0;font-family:var(--serif);font-size:20px}
.x{border:0;background:rgba(255,255,255,.2);color:inherit;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;border:1.5px solid rgba(255,255,255,.5);background:none;color:inherit;border-radius:999px;padding:7px;font-weight:600;cursor:pointer}
.seg button.on{background:#fff;color:var(--text);border-color:#fff}
.amt{font-family:var(--serif);font-weight:900;font-size:44px;text-align:center;background:none;border:0;color:inherit;padding:6px 0 0;direction:ltr}
.amt::placeholder{color:rgba(255,255,255,.55)}
.mtop.maaser .amt::placeholder{color:rgba(58,38,0,.4)}
.amt:focus{border:0;outline:none}
.mbody{padding:4px 18px 22px}
.cgrp{font-size:12.5px;color:var(--muted);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;display:inline-flex;gap:5px;align-items:center}
.chip.on{border-color:var(--c,var(--ink));background:var(--c,var(--ink));color:#fff}
.sugg{font-size:12px;color:var(--ink-soft);margin-top:6px;min-height:16px}
.heb{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
.rbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rbox img{max-height:70px;border-radius:10px}
.check{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:14.5px}
.check input{width:20px;height:20px}
.actions{display:flex;gap:8px;margin-top:20px}
.actions .pill{flex:1;justify-content:center}
.actions .pill.danger{flex:none}
.hidden{display:none!important}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ink-deep);color:#fff;padding:10px 20px;border-radius:999px;z-index:40;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.login{max-width:380px;margin:18vh auto 0;padding:0 18px;color:#fff;text-align:center}
.login .year{font-size:72px}
.login input{margin-top:24px;text-align:center}
.ed{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.ed input{padding:8px 10px}
.ed .ic{width:44px;text-align:center;font-size:18px;padding:8px 0}
code{background:#E3E6F5;padding:2px 7px;border-radius:6px;font-size:12.5px;direction:ltr;display:inline-block;word-break:break-all}
.viewer img{max-width:100%;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
// ======== הגדרה ========
const API = 'https://opex.meny85502.workers.dev';
const BRIDGE = 'http://127.0.0.1:17345'; // הגשר שרץ על המחשב (עדכון מהבנק)
// =======================

const PAY_METHODS = ['אשראי', 'מזומן', 'העברה', 'הוראת קבע', "צ'ק"];
const TYPE_LABEL = { expense: 'הוצאה', income: 'הכנסה', maaser: 'מעשרות' };
const GROUPS = [['קבועות', 'var(--g-fixed)', '#3554D1'], ['שוטפות', 'var(--g-run)', '#E5482F'], ['חד פעמיות', 'var(--g-once)', '#8E2C8A']];
const CARD_SOURCES = ['visaCal', 'max', 'isracard', 'amex'];
const CARD_BILL_RE = /ויזה|מאסטרקארד|מסטרקארד|ישראכרט|ישראכארט|כאל|מקס איט|דיינרס|אמריקן אקספרס|לאומי קארד|כרטיסי אשראי/i;
const MAASER_RE = /צדקה|צדקות|תרומה|תרומות|עזר מציון|קופת העיר|יתומים|הכנסת כלה|קופת רבי מאיר|קרן עולם התורה|מעשר/;
const S = { token: lsGet('kb_token'), boot: null, hy: null, txs: [], bank: [], view: lsGet('kb_view') || 'home', maaser: null,
  filter: { type: '', cat: '', month: '', q: '' }, showHidden: false };

function lsGet(k) { try { return localStorage.getItem(k) } catch { return null } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('he-IL', { maximumFractionDigits: 2 });
const fmt0 = n => Math.round(+n || 0).toLocaleString('he-IL');
const money = n => `<span class="num">₪${fmt(n)}</span>`;
const money0 = n => `<span class="num">₪${fmt0(n)}</span>`;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }

// ---------- API ----------
async function api(path, opts = {}) {
  const r = await fetch(API + path, { method: opts.method || 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (S.token || '') }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/login') { S.token = null; lsSet('kb_token', null); render(); throw new Error('צריך להתחבר מחדש'); }
  if (!r.ok) throw new Error(d.error || 'שגיאה');
  return d;
}

// ---------- תאריך עברי ----------
const isoToDate = s => new Date(s + 'T12:00:00');
const dateToIso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayIso = () => dateToIso(new Date());
const fEn = new Intl.DateTimeFormat('en-u-ca-hebrew', { year: 'numeric', month: 'long', day: 'numeric' });
const fHeM = new Intl.DateTimeFormat('he-u-ca-hebrew', { month: 'long' });
function hparts(iso) { const p = {}; fEn.formatToParts(isoToDate(iso)).forEach(x => p[x.type] = x.value); return { y: +p.year, m: p.month, d: +p.day }; }
function gem(n) {
  const u = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'], t = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'], h = ['', 'ק', 'ר', 'ש', 'ת'];
  let s = ''; n = n % 1000;
  while (n >= 400) { s += 'ת'; n -= 400; }
  s += h[Math.floor(n / 100)]; n %= 100;
  if (n === 15) s += 'טו'; else if (n === 16) s += 'טז'; else s += t[Math.floor(n / 10)] + u[n % 10];
  return s.length > 1 ? s.slice(0, -1) + '״' + s.slice(-1) : s + '׳';
}
const hMonth = iso => fHeM.format(isoToDate(iso));
const hDate = iso => gem(hparts(iso).d) + ' ' + hMonth(iso);
function roshHashana(y) { const d = new Date(y - 3761, 8, 1, 12); for (let i = 0; i < 45; i++) { const p = hparts(dateToIso(d)); if (p.m === 'Tishri' && p.d === 1) return dateToIso(d); d.setDate(d.getDate() + 1); } }
function yearRange(y) { const a = roshHashana(y), b = isoToDate(roshHashana(y + 1)); b.setDate(b.getDate() - 1); return [a, dateToIso(b)]; }
const gDate = iso => { const [y, m, d] = iso.split('-'); return `${+d}.${+m}`; };

// ---------- טעינה ----------
async function loadBoot() { S.boot = await api('/api/bootstrap'); buildDescMap(); }
async function loadYear() {
  const [a, b] = yearRange(S.hy);
  const [t, m, bk] = await Promise.all([api(`/api/tx?from=${a}&to=${b}`), api('/api/maaser'), api(`/api/bank?from=${a}&to=${b}`)]);
  S.txs = t.items; S.maaser = m; S.bank = bk.items; matchBank();
}
async function reloadAll() { await Promise.all([loadBoot(), loadYear()]); render(); }
const cats = type => (S.boot?.categories || []).filter(c => c.type === type);
const catById = id => (S.boot?.categories || []).find(c => c.id === id);

// ---------- הצעות אוטומטיות ----------
function ruleKey(d) { return String(d || '').replace(/[0-9*#\-_/\\.]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40); }
let DESC = {};
function buildDescMap() { DESC = {}; (S.boot.descriptions || []).forEach(d => { const k = d.type + '|' + d.description; if (!DESC[k] && d.category_id) DESC[k] = d.category_id; }); }
function suggest(text, type) {
  if (!text) return null;
  const rule = (S.boot.rules || []).find(r => r.pattern === ruleKey(text) && r.type === type);
  if (rule && rule.category_id) return rule.category_id;
  if (DESC[type + '|' + text.trim()]) return DESC[type + '|' + text.trim()];
  const s = text.toLowerCase(); let best = null, len = 0;
  cats(type).filter(c => c.active && c.keywords).forEach(c => c.keywords.split(',').forEach(k => { k = k.trim().toLowerCase(); if (k && k.length > len && s.includes(k)) { best = c.id; len = k.length; } }));
  return best;
}

// ---------- התאמת תנועות בנק לרישום ----------
const isCardSrc = b => CARD_SOURCES.includes(b.source);
const isCardBill = b => !isCardSrc(b) && b.amount < 0 && CARD_BILL_RE.test(b.description + ' ' + (b.memo || ''));
function matchBank() {
  const byId = {}; S.txs.forEach(t => byId[t.id] = t);
  const used = new Set();
  S.bank.forEach(b => { b.match = null; b.card = isCardBill(b); if (b.tx_id && byId[b.tx_id]) { b.match = byId[b.tx_id]; used.add(b.tx_id); } });
  S.bank.forEach(b => {
    if (b.match || b.card || b.status === 'ignored') return;
    const out = b.amount < 0, amt = Math.abs(b.amount), bd = isoToDate(b.date);
    let best = null, bdiff = 99;
    S.txs.forEach(t => {
      if (used.has(t.id) || (out ? t.type === 'income' : t.type !== 'income') || Math.abs(t.amount - amt) > 0.5) return;
      const diff = Math.abs((isoToDate(t.date) - bd) / 864e5);
      if (diff <= 6 && diff < bdiff) { best = t; bdiff = diff; }
    });
    if (best) { b.match = best; used.add(best.id); }
  });
  S.unmatched = S.bank.filter(b => !b.match && !b.card && b.status !== 'ignored').length;
}
function bankName(b) {
  const m = String(b.memo || '').match(/העברה (?:אל|מאת):\s*([^\d]+?)\s+\d/);
  return (m ? m[1] : b.description).trim();
}

}
function byMonth(list, keyFn) {

}

function remainingNow(r, onIso) {
  if (r.remaining == null) return null;
  const a = isoToDate(r.as_of), b = isoToDate(onIso || todayIso()); let n = 0;
  for (let d = new Date(a.getFullYear(), a.getMonth(), 1, 12); d <= b; d.setMonth(d.getMonth() + 1)) {
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    const pay = new Date(d.getFullYear(), d.getMonth(), Math.min(r.day || 1, last), 12);
    if (pay > a && pay <= b) n++;
  }
  return Math.max(0, r.remaining - n);
}
function endLabel(r, rem) {

}

// ---------- בפועל: השוואה לבנק ולאשראי ----------
function bankHTML() {
  const vis = S.bank.filter(b => S.showHidden || b.status !== 'ignored');
  // השוואה חודשית
  const months = byMonth(S.txs.filter(t => t.type !== 'income').concat(S.bank.filter(b => b.amount < 0 && b.status !== 'ignored').map(b => ({ date: b.date, _b: b }))));
  const rows = months.map(m => {
    const rec = m.items.filter(x => !x._b).reduce((a, t) => a + t.amount, 0);
    const bs = m.items.filter(x => x._b).map(x => x._b);
    const cardDetail = bs.filter(isCardSrc).reduce((a, b) => a - b.amount, 0);
    const bills = bs.filter(b => b.card).reduce((a, b) => a - b.amount, 0);
    const bankOut = bs.filter(b => !b.card && !isCardSrc(b)).reduce((a, b) => a - b.amount, 0);
    return { name: m.name, rec, act: bankOut + (cardDetail > 0 ? cardDetail : bills), viaCard: cardDetail > 0 ? 'פירוט אשראי' : bills ? 'סכום חיובי כרטיס' : '' };
  }).filter(r => r.act > 0);
  const max = Math.max(1, ...rows.flatMap(r => [r.rec, r.act]));
  const list = vis.map(b => {
    const st = b.status === 'ignored' ? `<span class="tag card">מוסתר</span> <button class="pill ghost sm" onclick="bankAct(${b.id},'unhide')">החזר</button>`
      : b.card ? `<span class="tag card">חיוב כרטיס אשראי. הפירוט מגיע מחברת האשראי</span>`
      : b.match ? `<span class="tag ok">✓ ${b.match.type === 'maaser' ? 'נרשם כמעשרות' : 'נרשם'}: ${esc(b.match.description || '')}</span>${b.tx_id ? '' : ''}`
      : `<span class="tag no">לא נרשם</span> <button class="pill ink sm" onclick="fromBank(${b.id})">+ רשום</button> <button class="pill ghost sm" onclick="bankAct(${b.id},'hide')">הסתר</button>`;
    return `<div class="bk-row ${b.card || b.status === 'ignored' ? 'dim' : ''}">
      <div class="top"><span>${esc(bankName(b))}</span><span class="num" style="color:${b.amount < 0 ? 'var(--exp)' : 'var(--inc)'}">${b.amount < 0 ? '−' : '+'}₪${fmt(Math.abs(b.amount))}</span></div>
      <div class="meta">${esc(hDate(b.date))} (${gDate(b.date)}), ${esc(b.description)}${b.memo ? ', ' + esc(b.memo) : ''}</div>
      <div class="act">${st}</div></div>`;
  }).join('');
  return `<h2 class="sec">בפועל מול מה שרשמתי</h2>
  <p class="muted" style="margin-top:-6px">נתוני הבנק והאשראי לא נספרים בהוצאות שלך. הם כאן רק כדי לבדוק שלא שכחת לרשום משהו.</p>
  <button class="pill ink" onclick="bridgeUpdate()" ${S.syncing ? 'disabled' : ''}>${S.syncing ? 'מתחבר לבנק, זה לוקח בערך דקה…' : 'עדכן מהבנק ומהאשראי'}</button>
  ${S.syncMsg ? `<div class="syncmsg">${S.syncMsg}</div>` : ''}
  ${rows.length ? `<h2 class="sec">לפי חודשים <small>כהה = יצא בפועל, צבעוני = רשמתי</small></h2>${rows.map(r => {
    const d = r.act - r.rec;
    return `<div class="cmp"><div class="m">${esc(r.name)}</div>
      <div class="ln" style="width:${r.act / max * 100}%;background:var(--ink)"></div><div class="v num">₪${fmt0(r.act)}</div>
      <div class="ln" style="width:${r.rec / max * 100}%;background:var(--maa)"></div><div class="v num">₪${fmt0(r.rec)}</div>
      <div class="gap ${Math.abs(d) < 1 ? 'ok-t' : d > 0 ? 'er-t' : ''}">${Math.abs(d) < 1 ? 'תואם' : d > 0 ? `יצא ₪${fmt0(d)} יותר ממה שרשמת` : `רשמת ₪${fmt0(-d)} יותר`}${r.viaCard ? ` (אשראי לפי ${r.viaCard})` : ''}</div></div>`; }).join('')}` : ''}
  <h2 class="sec">תנועות <small>${S.unmatched || 0} לא נרשמו</small></h2>
  <label class="check" style="margin-top:0"><input type="checkbox" ${S.showHidden ? 'checked' : ''} onchange="S.showHidden=this.checked;render()"> הצג מוסתרות</label>
  ${list || '<div class="empty">אין עדיין נתונים מהבנק לשנה הזו. לחץ על "עדכן מהבנק ומהאשראי".</div>'}
  <h2 class="sec">ייבוא קובץ</h2>
  <p class="muted">קובץ JSON מכספיון או מ-israeli-bank-scrapers. תנועות שכבר יובאו לא ייכנסו שוב.</p>
  <input type="file" accept=".json,application/json" onchange="bankFile(this)">`;
}
function fromBank(id) {
  const b = S.bank.find(x => x.id === id); const text = bankName(b) + ' ' + b.description + ' ' + (b.memo || '');
  const rule = (S.boot.rules || []).find(r => r.pattern === ruleKey(b.description + ' ' + (b.memo || '')));
  const type = b.amount > 0 ? 'income' : rule?.type === 'maaser' || MAASER_RE.test(text) ? 'maaser' : 'expense';
  openTx({ type, amount: Math.abs(b.amount), date: b.date, description: bankName(b), note: b.memo || '', bank_id: b.id,
    category_id: type === 'maaser' ? null : (rule && rule.type === type ? rule.category_id : suggest(text, type)),
    payment_method: isCardSrc(b) ? 'אשראי' : /העברה|הע\./.test(text) ? 'העברה' : '' });
}
async function bankAct(id, act) { try { await api(`/api/bank/${id}/${act}`, { method: 'POST' }); const b = S.bank.find(x => x.id === id); b.status = act === 'hide' ? 'ignored' : 'pending'; matchBank(); render(); } catch (e) { toast(e.message); } }
async function bankFile(inp) {
  const f = inp.files[0]; if (!f) return;
  try { const r = await api('/api/bank/import', { method: 'POST', body: JSON.parse(await f.text()) }); toast(`נוספו ${r.added} תנועות (${r.duplicates} כבר היו)`); await loadYear(); render(); }
  catch (e) { toast('שגיאה: ' + e.message); }
}
async function bridgeUpdate() {
  if (S.syncing) return;
  let st;
  try { const ctl = new AbortController(); setTimeout(() => ctl.abort(), 2500); st = await (await fetch(BRIDGE + '/api/status', { signal: ctl.signal })).json(); }
  catch (e) { S.syncMsg = '<span class="er-t">הגשר לא עונה.</span> העדכון עובד רק מהמחשב שהגשר מותקן עליו. אם הוא מותקן, הפעל את start-hidden.vbs. אם הדפדפן שאל על גישה לרשת המקומית, צריך לאשר.'; go('bank'); return; }
  if (!st.accounts || !st.accounts.length) { S.syncMsg = `<span class="er-t">לא הוגדרו חשבונות בגשר.</span> פתח במחשב את <a href="${BRIDGE}" target="_blank">${BRIDGE}</a>`; go('bank'); return; }
  S.syncing = true; S.syncMsg = ''; go('bank');
  try {
    const r = await fetch(BRIDGE + '/api/scrape', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'שגיאה');
    S.syncMsg = d.results.map(x => x.ok ? `<div class="ok-t">✓ ${esc(x.label)}: ${x.added} תנועות חדשות</div>` : `<div class="er-t">✗ ${esc(x.label)}: ${esc(x.error)}</div>`).join('');
  } catch (e) { S.syncMsg = '<span class="er-t">' + esc(e.message) + '</span>'; }
  S.syncing = false; await loadYear(); render();
}

async function catAdd(type, inp) { const n = $('#' + inp).value.trim(); if (!n) return; try { await api('/api/categories', { method: 'POST', body: { type, name: n } }); await loadBoot(); render(); } catch (e) { toast(e.message); } }

// ---------- חלון ----------
function modal(html) {

function closeModal() { $('#mbg')?.remove(); F = null; R = null; }

// ---------- טופס רישום ----------
let F = null;
function openTx(arg) {
  const t = typeof arg === 'number' ? S.txs.find(x => x.id === arg) : null;
  F = t ? { ...t, receipt: null, removeReceipt: false, catTouched: true }
    : { id: null, date: todayIso(), amount: '', category_id: null, description: '', payment_method: '', note: '', maaser_liable: 1, has_receipt: 0, receipt: null, catTouched: false, ...arg };
  if (arg.category_id) F.catTouched = true;
  if (F.type === 'income' && F.category_id && !F.id) F.maaser_liable = catById(F.category_id)?.maaser_liable ?? 1;
  drawForm();
}
function catChips() {
  if (F.type === 'maaser') return '';
  const list = cats(F.type).filter(c => c.active || c.id === F.category_id);
  const chip = c => `<button class="chip ${F.category_id === c.id ? 'on' : ''}" style="--c:${c.color || 'var(--ink)'}" onclick="pickCat(${c.id})">${c.icon || ''} ${esc(c.name)}</button>`;
  if (F.type === 'income') return `<div class="chips">${list.map(chip).join('')}</div>`;
  return GROUPS.map(([g]) => { const l = list.filter(c => (c.grp || 'שוטפות') === g); return l.length ? `<div class="cgrp">${g}</div><div class="chips">${l.map(chip).join('')}</div>` : ''; }).join('');
}
function drawForm() {
  const seen = new Set();
  const descs = (S.boot.descriptions || []).filter(d => d.type === F.type && !seen.has(d.description) && seen.add(d.description)).map(d => `<option value="${esc(d.description)}">`).join('');
  modal(`<div class="mtop ${F.type}">
      <div class="row1"><h3>${F.id ? 'עריכה' : F.bank_id ? 'רישום מתנועת בנק' : 'רישום חדש'}</h3><button class="x" onclick="closeModal()" aria-label="סגור">×</button></div>
      <div class="seg">${['expense', 'income', 'maaser'].map(t => `<button class="${F.type === t ? 'on' : ''}" onclick="setType('${t}')">${TYPE_LABEL[t]}</button>`).join('')}</div>
      <input class="amt" id="fAmount" type="number" inputmode="decimal" step="0.01" placeholder="₪0" value="${esc(F.amount)}" oninput="F.amount=this.value" style="width:100%">
    </div>
    <div class="mbody">
      <label class="f">${F.type === 'maaser' ? 'למי' : F.type === 'income' ? 'ממי / ממה' : 'על מה'}</label>
      <input id="fDesc" list="dl" value="${esc(F.description)}" oninput="descInput(this.value)" autocomplete="off" placeholder="${F.type === 'maaser' ? 'שם המוסד או האדם' : F.type === 'income' ? 'למשל משכורת' : 'למשל שופרסל'}"><datalist id="dl">${descs}</datalist>
      <div id="catBox">${F.type !== 'maaser' ? `<div class="sugg" id="sugg">${!F.catTouched && F.category_id ? 'הוצע אוטומטית לפי התיאור' : ''}</div>${catChips()}` : ''}</div>
      <label class="f">תאריך</label><input type="date" value="${esc(F.date)}" onchange="F.date=this.value;$('#fHeb').textContent=hDate(this.value)+' '+gem(hparts(this.value).y)">
      <div class="heb" id="fHeb">${esc(hDate(F.date))} ${gem(hparts(F.date).y)}</div>
      <label class="f">אמצעי תשלום</label><div class="chips">${PAY_METHODS.map(p => `<button class="chip ${F.payment_method === p ? 'on' : ''}" onclick="setPay(this,'${p.replace(/'/g, "\\'")}')">${esc(p)}</button>`).join('')}</div>
      ${F.type === 'income' ? `<label class="check"><input type="checkbox" id="fLiable" ${F.maaser_liable ? 'checked' : ''} onchange="F.maaser_liable=this.checked?1:0"> חייב במעשר</label>` : ''}
      <label class="f">הערה</label><textarea rows="2" oninput="F.note=this.value">${esc(F.note)}</textarea>
      <label class="f">קבלה</label><div class="rbox" id="rbox">${receiptBox()}</div>
      <div class="actions"><button class="pill ${F.type === 'expense' ? 'exp' : F.type === 'income' ? 'inc' : 'maa'}" id="fSave" onclick="saveTx()">שמור</button>
        ${F.id ? `<button class="pill danger" onclick="delTx()">מחק</button>` : ''}</div>
    </div>`);
  if (!F.id && !F.amount) setTimeout(() => $('#fAmount')?.focus(), 60);
}
function keep() { F.amount = $('#fAmount')?.value ?? F.amount; F.description = $('#fDesc')?.value ?? F.description; }
function setType(t) { keep(); if (t === F.type) return; F.type = t; if (!F.catTouched || t === 'maaser') { F.category_id = t === 'maaser' ? null : suggest(F.description, t); F.catTouched = false; } else F.category_id = null; drawForm(); }
function pickCat(id) { F.category_id = id; F.catTouched = true; if (F.type === 'income' && !F.id) { F.maaser_liable = catById(id)?.maaser_liable ?? 1; const l = $('#fLiable'); if (l) l.checked = !!F.maaser_liable; } redrawCats(); $('#sugg').textContent = ''; }
function redrawCats() { const box = $('#catBox'); if (!box) return; const sg = $('#sugg')?.outerHTML || '<div class="sugg" id="sugg"></div>'; box.innerHTML = sg + catChips(); }
function descInput(v) {
  F.description = v;

  const s = suggest(v, F.type);
  if (s !== F.category_id) { F.category_id = s; redrawCats(); $('#sugg').textContent = s ? 'הוצע אוטומטית לפי התיאור' : ''; }
}
function setPay(el, p) { F.payment_method = F.payment_method === p ? '' : p; el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el && !!F.payment_method)); }
function receiptBox() {
  if (F.receipt) return `${F.receipt.mime.startsWith('image/') ? `<img src="data:${F.receipt.mime};base64,${F.receipt.data}" alt="">` : `<span>📄 ${esc(F.receipt.name)}</span>`}<button class="pill danger sm" onclick="F.receipt=null;$('#rbox').innerHTML=receiptBox()">הסר</button>`;
  if (F.has_receipt && !F.removeReceipt) return `<button class="pill ghost sm" onclick="viewReceipt(${F.id})">📎 הצג קבלה</button><button class="pill danger sm" onclick="F.removeReceipt=true;$('#rbox').innerHTML=receiptBox()">מחק קבלה</button>${pickers()}`;
  return pickers();

function pickers() {
  return `<label class="pill ghost sm">📷 צלם<input type="file" accept="image/*" capture="environment" class="hidden" onchange="pickReceipt(this)"></label>
          <label class="pill ghost sm">📁 קובץ<input type="file" accept="image/*,application/pdf" class="hidden" onchange="pickReceipt(this)"></label>`;
}
async function pickReceipt(inp) {
  const f = inp.files[0]; if (!f) return;
  try {
    if (f.type.startsWith('image/')) F.receipt = await compressImage(f);
    else { if (f.size > 4.4e6) return toast('ה-PDF גדול מ-4MB'); F.receipt = { mime: f.type || 'application/pdf', name: f.name, data: await b64(f) }; }
    $('#rbox').innerHTML = receiptBox();
  } catch (e) { toast('לא הצלחתי לקרוא את הקובץ'); }
}
function b64(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); }); }
async function compressImage(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const sc = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.72));
  return { mime: 'image/jpeg', name: file.name.replace(/\.\w+$/, '') + '.jpg', data: await b64(blob) };
}
async function saveTx() {
  keep();
  if (!(+F.amount > 0)) return toast('חסר סכום');
  if (F.type !== 'maaser' && !F.category_id) return toast('בחר קטגוריה');
  const btn = $('#fSave'); btn.disabled = true; btn.textContent = 'שומר…';
  const body = { type: F.type, date: F.date, amount: +F.amount, category_id: F.type === 'maaser' ? null : F.category_id, description: F.description, payment_method: F.payment_method, note: F.note, maaser_liable: F.maaser_liable, bank_id: F.bank_id || undefined };
  try {
    let id = F.id;
    if (id) await api('/api/tx/' + id, { method: 'PUT', body }); else id = (await api('/api/tx', { method: 'POST', body })).id;
    if (F.receipt) await api('/api/receipt/' + id, { method: 'POST', body: F.receipt });
    else if (F.removeReceipt) await api('/api/receipt/' + id, { method: 'DELETE' });
    closeModal(); toast('נשמר'); await reloadAll();
  } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = 'שמור'; }
}
async function delTx() { if (!confirm('למחוק את הרישום?')) return; try { await api('/api/tx/' + F.id, { method: 'DELETE' }); closeModal(); toast('נמחק'); await reloadAll(); } catch (e) { toast(e.message); } }
async function viewReceipt(id) {
  try {
    toast('טוען קבלה…');
    const r = await api('/api/receipt/' + id);
    const bin = atob(r.data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u], { type: r.mime }));
    if (r.mime.startsWith('image/')) {
      const v = document.createElement('div'); v.className = 'mbg'; v.style.zIndex = 30; v.onclick = () => v.remove();
      v.innerHTML = `<div class="modal viewer" style="padding:16px"><img src="${url}" alt="קבלה"><a class="pill ghost sm" style="margin-top:10px;text-decoration:none" href="${url}" download="${esc(r.name || 'receipt.jpg')}">הורדה</a></div>`;
      document.body.appendChild(v);
    } else window.open(url, '_blank');
  } catch (e) { toast(e.message); }
}

render();
if (S.token) reloadAll().catch(e => toast(e.message));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
