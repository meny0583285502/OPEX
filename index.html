<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כספי הבית</title>
<meta name="theme-color" content="#0f5c4c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ec; --card:#fff; --ink:#1c2622; --muted:#6b756f; --line:#e4e1d6;
  --brand:#0f5c4c; --brand-soft:#e3efe9;
  --exp:#b3432e; --exp-soft:#f8e7e2; --inc:#2b7a3d; --inc-soft:#e4f2e6; --maa:#9a6f12; --maa-soft:#f6eed9;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:960px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:20px;margin:0;font-weight:800;color:var(--brand);flex:1}
.yearsel{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.yearsel button{border:0;background:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px}
.yearsel button:hover{background:var(--brand-soft)}
.yearsel span{font-weight:700;min-width:64px;text-align:center}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 12px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:800;margin-top:4px;direction:ltr;text-align:right}
.stat.inc .v{color:var(--inc)} .stat.exp .v{color:var(--exp)} .stat.maa .v{color:var(--maa)}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.qbtn{border:0;border-radius:var(--radius);padding:14px 6px;font-weight:700;cursor:pointer;font-size:15px}
.qbtn.exp{background:var(--exp-soft);color:var(--exp)} .qbtn.inc{background:var(--inc-soft);color:var(--inc)} .qbtn.maa{background:var(--maa-soft);color:var(--maa)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px}
td.n,th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
.scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px;font-weight:800}
.row.expense .dot{background:var(--exp-soft);color:var(--exp)} .row.income .dot{background:var(--inc-soft);color:var(--inc)} .row.maaser .dot{background:var(--maa-soft);color:var(--maa)}
.row .mid{flex:1;min-width:0}
.row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12.5px;color:var(--muted)}
.row .amt{font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
.row.expense .amt{color:var(--exp)} .row.income .amt{color:var(--inc)} .row.maaser .amt{color:var(--maa)}
.clip{font-size:13px}
.daysep{font-size:12.5px;color:var(--muted);font-weight:600;padding:12px 2px 2px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.bottom .in{display:flex;max-width:960px;width:100%}
nav.bottom button{flex:1;border:0;background:none;padding:9px 0 10px;cursor:pointer;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--brand);font-weight:700}
.badge{position:absolute;top:4px;left:calc(50% - 20px);background:var(--exp);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px;font-weight:700}
.fab{position:fixed;bottom:76px;left:20px;width:58px;height:58px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(15,92,76,.35);cursor:pointer;z-index:9}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{flex:1;min-width:120px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:var(--exp-soft);color:var(--exp)}
.btn.sm{padding:7px 11px;font-size:14px}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#eceae1;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on.expense{background:#fff;color:var(--exp)} .seg button.on.income{background:#fff;color:var(--inc)} .seg button.on.maaser{background:#fff;color:var(--maa)}
.amount-in{font-size:30px;font-weight:800;text-align:center;direction:ltr;padding:12px}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--bg);width:100%;max-width:520px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
@media(min-width:700px){.modal{border-radius:18px}}
.modal h3{margin:0 0 12px;font-size:18px}
.mhead{display:flex;align-items:center;justify-content:space-between}
.x{border:0;background:none;font-size:26px;cursor:pointer;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:18px}
.actions .btn{flex:1}
.heb{font-size:12.5px;color:var(--brand);margin-top:4px}
.receipt-box{border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.receipt-box img{max-height:70px;border-radius:8px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.check input{width:20px;height:20px}
.empty{color:var(--muted);text-align:center;padding:26px 0}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:40;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.login{max-width:360px;margin:16vh auto 0;text-align:center}
.login h1{color:var(--brand);font-size:28px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv b{direction:ltr;font-variant-numeric:tabular-nums}
.big-maa{font-size:34px;font-weight:800;color:var(--maa);direction:ltr;text-align:right}
.muted{color:var(--muted);font-size:13px}
.flex{display:flex;gap:8px;align-items:center}
.flex>*{flex:1}
.ed{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ed input{padding:7px 9px}
.ed .nm{flex:2}.ed .sm{flex:1;min-width:60px}
.rec{display:grid;grid-template-columns:1fr 1fr auto auto;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.rec input,.rec select{padding:7px 9px}
.rec .nm{grid-column:1/-1}
@media(min-width:700px){.rec{grid-template-columns:2fr 1fr 1fr auto auto}.rec .nm{grid-column:auto}}
.rec.add{grid-template-columns:1fr 1fr}
.rec.add .nm,.rec.add select,.rec.add button{grid-column:1/-1}
@media(min-width:700px){.rec.add{grid-template-columns:2fr 1fr 1fr 1.3fr auto}.rec.add .nm,.rec.add select,.rec.add button{grid-column:auto}}
.bank-row{padding:12px 0;border-bottom:1px solid var(--line)}
.bank-row .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.bank-row .ctrl{display:grid;grid-template-columns:1fr 1.3fr auto auto;gap:6px;margin-top:8px}
.bank-row .ctrl select{padding:7px}
code{background:#eceae1;padding:2px 6px;border-radius:6px;font-size:12.5px;direction:ltr;display:inline-block;word-break:break-all}
.hidden{display:none!important}
.sync{border:0;background:var(--card);border:1px solid var(--line);width:40px;height:40px;border-radius:50%;cursor:pointer;color:var(--brand);display:grid;place-items:center}
.sync svg{width:20px;height:20px}
.sync.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.syncbig{width:100%;padding:15px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.res-ok{color:var(--inc)}.res-er{color:var(--exp)}
.viewer img{max-width:100%;border-radius:10px}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
// ======== הגדרה: כתובת ה-Worker ========
const API = 'https://kaspei-bayit.meny85502.workers.dev';
const BRIDGE = 'http://127.0.0.1:17345'; // הגשר שרץ על המחשב (עדכון מהבנק)
// =======================================

const PAY_METHODS = ['אשראי', 'מזומן', 'העברה', 'הוראת קבע', "צ'ק"];
const TYPE_LABEL = { expense: 'הוצאה', income: 'הכנסה', maaser: 'מעשרות' };
const S = { token: lsGet('kb_token'), boot: null, hy: null, txs: [], view: lsGet('kb_view') || 'home', maaser: null, filter: { type: '', cat: '', month: '', q: '' }, bank: [] };

function lsGet(k) { try { return localStorage.getItem(k) } catch { return null } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const money = n => '₪' + fmt(n);
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2400); }

// ---------- API ----------
async function api(path, opts = {}) {
  const r = await fetch(API + path, { method: opts.method || 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (S.token || '') }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/login') { S.token = null; lsSet('kb_token', null); render(); throw new Error('נדרשת התחברות'); }
  if (!r.ok) throw new Error(d.error || 'שגיאה');
  return d;
}

// ---------- תאריך עברי ----------
const isoToDate = s => new Date(s + 'T12:00:00');
const dateToIso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayIso = () => dateToIso(new Date());
const fEn = new Intl.DateTimeFormat('en-u-ca-hebrew', { year: 'numeric', month: 'long', day: 'numeric' });
const fHeM = new Intl.DateTimeFormat('he-u-ca-hebrew', { month: 'long' });
function hparts(iso) { const p = {}; fEn.formatToParts(isoToDate(iso)).forEach(x => p[x.type] = x.value); return { y: +p.year, m: p.month, d: +p.day }; }
function gem(n) {
  const units = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'], tens = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'], hund = ['', 'ק', 'ר', 'ש', 'ת'];
  let s = ''; n = n % 1000;
  while (n >= 400) { s += 'ת'; n -= 400; }
  s += hund[Math.floor(n / 100)]; n %= 100;
  if (n === 15) s += 'טו'; else if (n === 16) s += 'טז'; else s += tens[Math.floor(n / 10)] + units[n % 10];
  return s.length > 1 ? s.slice(0, -1) + '"' + s.slice(-1) : s + "'";
}
const hYearName = y => gem(y);
const hMonth = iso => fHeM.format(isoToDate(iso));
const hDate = iso => { const p = hparts(iso); return gem(p.d) + ' ' + hMonth(iso); };
function roshHashana(y) { // תאריך לועזי של א' תשרי בשנה y
  const d = new Date(y - 3761, 8, 1, 12);
  for (let i = 0; i < 45; i++) { const p = hparts(dateToIso(d)); if (p.m === 'Tishri' && p.d === 1) return dateToIso(d); d.setDate(d.getDate() + 1); }
}
function yearRange(y) { const a = roshHashana(y), b = isoToDate(roshHashana(y + 1)); b.setDate(b.getDate() - 1); return [a, dateToIso(b)]; }

// ---------- טעינה ----------
async function loadBoot() { S.boot = await api('/api/bootstrap'); }
async function loadYear() {
  const [a, b] = yearRange(S.hy);
  const [t, m] = await Promise.all([api(`/api/tx?from=${a}&to=${b}`), api('/api/maaser')]);
  S.txs = t.items; S.maaser = m;
}
async function reloadAll() { await Promise.all([loadBoot(), loadYear()]); render(); }
const catsOf = type => (S.boot?.categories || []).filter(c => c.type === type);
const catName = id => (S.boot?.categories || []).find(c => c.id === id)?.name || '';

// ---------- תצוגה ראשית ----------
function render() {
  const root = $('#root');
  if (!S.token) { root.innerHTML = loginHTML(); $('#pw').focus(); return; }
  if (!S.boot) { root.innerHTML = '<div class="empty" style="margin-top:30vh">טוען…</div>'; return; }
  const views = { home: homeHTML, list: listHTML, maaser: maaserHTML, bank: bankHTML, settings: settingsHTML };
  root.innerHTML = `<div class="app">
    <header class="top"><h1>כספי הבית</h1>
      <button class="sync ${S.syncing ? 'spin' : ''}" onclick="bridgeUpdate()" title="עדכן מהבנק"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 01-15.5 6.2M3 12A9 9 0 0118.5 5.8"/><path d="M18.5 2v3.8h-3.8M5.5 22v-3.8h3.8"/></svg></button>
      <div class="yearsel"><button onclick="chYear(-1)" title="שנה קודמת">›</button><span>${hYearName(S.hy)}</span><button onclick="chYear(1)" title="שנה הבאה">‹</button></div>
    </header>
    ${(views[S.view] || homeHTML)()}
  </div>
  <button class="fab" onclick="openTx({type:'expense'})" title="תנועה חדשה">+</button>
  <nav class="bottom"><div class="in">
    ${navBtn('home', 'ראשי', '<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>')}
    ${navBtn('list', 'תנועות', '<path d="M4 6h16M4 12h16M4 18h10"/>')}
    ${navBtn('maaser', 'מעשרות', '<path d="M12 21s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.5-7 10-7 10z"/>')}
    ${navBtn('bank', 'בנק', '<path d="M3 10h18M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18M12 3l9 5H3z"/>', S.boot.bankPending)}
    ${navBtn('settings', 'הגדרות', '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>')}
  </div></nav>`;
  if (S.view === 'bank') loadBank();
}
function navBtn(v, label, path, badge) {
  return `<button class="${S.view === v ? 'on' : ''}" onclick="go('${v}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg>${label}${badge ? `<span class="badge">${badge}</span>` : ''}</button>`;
}
function go(v) { S.view = v; lsSet('kb_view', v); render(); window.scrollTo(0, 0); }
async function chYear(d) { S.hy += d; render(); try { await loadYear(); render(); } catch (e) { toast(e.message); } }

// ---------- כניסה ----------
function loginHTML() {
  return `<div class="login card"><h1>כספי הבית</h1><p class="muted">הכנס סיסמה</p>
    <form onsubmit="doLogin(event)"><input id="pw" type="password" autocomplete="current-password" placeholder="סיסמה">
    <button class="btn" style="width:100%;margin-top:12px">כניסה</button></form></div>`;
}
async function doLogin(e) {
  e.preventDefault();
  try { const d = await api('/api/login', { method: 'POST', body: { password: $('#pw').value } }); S.token = d.token; lsSet('kb_token', d.token); render(); await reloadAll(); }
  catch (err) { toast(err.message); }
}

// ---------- מסך ראשי ----------
function sums(list) {
  const r = { income: 0, expense: 0, maaser: 0, liable: 0 };
  list.forEach(t => { r[t.type] += t.amount; if (t.type === 'income' && t.maaser_liable) r.liable += t.amount; });
  return r;
}
function homeHTML() {
  const s = sums(S.txs), m = S.maaser || {};
  const pct = (+S.boot.settings.maaser_percent || 10) / 100;
  // טבלה לפי חודשים עבריים
  const months = [], byM = {};
  [...S.txs].sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    const k = hMonth(t.date);
    if (!byM[k]) { byM[k] = { name: k, cats: {}, exp: 0, inc: 0, maa: 0 }; months.push(byM[k]); }
    const o = byM[k];
    if (t.type === 'expense') { o.exp += t.amount; o.cats[t.category_id] = (o.cats[t.category_id] || 0) + t.amount; }
    else if (t.type === 'income') o.inc += t.amount; else o.maa += t.amount;
  });
  const usedCats = catsOf('expense').filter(c => months.some(mo => mo.cats[c.id]));
  if (months.some(mo => mo.cats['null'])) usedCats.push({ id: null, name: 'ללא קטגוריה' });
  const totCats = {}; usedCats.forEach(c => totCats[c.id] = months.reduce((a, mo) => a + (mo.cats[c.id] || 0), 0));
  const recent = [...S.txs].slice(0, 8);
  return `
  <div class="quick">
    <button class="qbtn exp" onclick="openTx({type:'expense'})">+ הוצאה</button>
    <button class="qbtn inc" onclick="openTx({type:'income'})">+ הכנסה</button>
    <button class="qbtn maa" onclick="openTx({type:'maaser'})">+ מעשרות</button>
  </div>
  <div class="stats">
    <div class="stat inc"><div class="l">הכנסות ${hYearName(S.hy)}</div><div class="v">${money(s.income)}</div></div>
    <div class="stat exp"><div class="l">הוצאות ${hYearName(S.hy)}</div><div class="v">${money(s.expense)}</div></div>
    <div class="stat"><div class="l">נשאר (הכנסות פחות הוצאות ומעשרות)</div><div class="v">${money(s.income - s.expense - s.maaser)}</div></div>

    <input type="file" accept=".json,application/json" onchange="bankFile(this)">
    <p class="muted" style="margin-top:14px">ייבוא אוטומטי מסקריפט: <code>POST ${esc(API)}/api/bank/import</code> עם הכותרת <code>X-Import-Key</code> והתוצאה של הסקרייפר בגוף הבקשה.</p>

async function bridgeUpdate() {
  if (S.syncing) return;
  let st;
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 2500);
    st = await (await fetch(BRIDGE + '/api/status', { signal: ctl.signal })).json();
  } catch (e) {
    S.syncMsg = '<span class="res-er">הגשר לא זמין.</span> העדכון מהבנק עובד רק מהמחשב שבו מותקן הגשר, כשהוא פועל. אם הוא מותקן — הפעל אותו מחדש (start-hidden.vbs). אם הדפדפן שאל "לאפשר גישה לרשת המקומית" — יש לאשר.';
    if (S.view !== 'bank') go('bank'); else render(); return;
  }
  if (!st.accounts || !st.accounts.length) { S.syncMsg = '<span class="res-er">בגשר לא הוגדרו חשבונות.</span> פתח במחשב: <a href="' + BRIDGE + '" target="_blank">' + BRIDGE + '</a>'; go('bank'); return; }
  S.syncing = true; S.syncMsg = ''; if (S.view !== 'bank') go('bank'); else render();
  try {
    const r = await fetch(BRIDGE + '/api/scrape', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'שגיאה');
    S.syncMsg = d.results.map(x => x.ok ? `<div class="res-ok">✓ ${esc(x.label)}: ${x.added} תנועות חדשות (${x.scraped} נמשכו)</div>` : `<div class="res-er">✗ ${esc(x.label)}: ${esc(x.error)}</div>`).join('');
  } catch (e) { S.syncMsg = '<span class="res-er">' + esc(e.message) + '</span>'; }
  S.syncing = false; S.bank = []; await loadBank(); render();
}
async function loadBank() { if (S._bankLoading) return; S._bankLoading = true; try { const d = await api('/api/bank/pending'); const changed = JSON.stringify(d.items) !== JSON.stringify(S.bank); S.bank = d.items; S.boot.bankPending = d.items.length; if (changed && S.view === 'bank') render(); } catch (e) { toast(e.message); } finally { S._bankLoading = false; } }
function bankType(id, type) {
  const sel = $('#bc' + id); sel.classList.toggle('hidden', type === 'maaser');
  sel.innerHTML = '<option value="">קטגוריה…</option>' + catsOf(type).filter(c => c.active).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
}
async function bankApprove(id) {
  const type = $('#bt' + id).value, cat = $('#bc' + id).value;
  if (type !== 'maaser' && !cat) return toast('בחר קטגוריה');
  try { await api(`/api/bank/${id}/approve`, { method: 'POST', body: { type, category_id: cat ? +cat : null } }); S.bank = S.bank.filter(b => b.id !== id); S.boot.bankPending = S.bank.length; await loadYear(); render(); toast('נוסף'); } catch (e) { toast(e.message); }
}
async function bankApproveSuggested() {
  const list = S.bank.filter(b => { const t = $('#bt' + b.id).value; return t === 'maaser' || $('#bc' + b.id).value; });
  if (!list.length) return toast('אין שורות עם קטגוריה');
  for (const b of list) await api(`/api/bank/${b.id}/approve`, { method: 'POST', body: { type: $('#bt' + b.id).value, category_id: +$('#bc' + b.id).value || null } }).catch(() => {});
  S.bank = []; await loadYear(); render(); toast(`אושרו ${list.length}`);
}
async function bankIgnore(id) { try { await api(`/api/bank/${id}/ignore`, { method: 'POST' }); S.bank = S.bank.filter(b => b.id !== id); S.boot.bankPending = S.bank.length; render(); } catch (e) { toast(e.message); } }
async function bankFile(inp) {
  const f = inp.files[0]; if (!f) return;
  try { const data = JSON.parse(await f.text()); const r = await api('/api/bank/import', { method: 'POST', body: data }); toast(`נוספו ${r.added} תנועות (${r.duplicates} כפולות)`); S.bank = []; loadBank(); }
  catch (e) { toast('שגיאה: ' + e.message); }
}

async function catAdd(type, inp) { const n = $('#' + inp).value.trim(); if (!n) return; try { await api('/api/categories', { method: 'POST', body: { type, name: n } }); await loadBoot(); render(); } catch (e) { toast(e.message); } }

async function catDel(id) { if (!confirm('למחוק את הקטגוריה? (אם יש בה תנועות היא רק תוסתר)')) return; try { await api('/api/categories/' + id, { method: 'DELETE' }); await loadBoot(); render(); } catch (e) { toast(e.message); } }

// ---------- טופס תנועה ----------
let F = null; // מצב הטופס
function openTx(arg) {
  const t = typeof arg === 'number' ? S.txs.find(x => x.id === arg) : null;
  F = t ? { ...t, receipt: null, removeReceipt: false } : { id: null, type: arg.type, date: todayIso(), amount: '', category_id: null, description: '', payment_method: '', note: '', maaser_liable: 1, has_receipt: 0, receipt: null };
  if (!t && F.type !== 'maaser') { const c = catsOf(F.type).filter(c => c.active); if (c.length === 1) F.category_id = c[0].id; }
  drawForm();
}
function drawForm() {
  let bg = $('#mbg'); if (!bg) { bg = document.createElement('div'); bg.id = 'mbg'; bg.className = 'modal-bg'; bg.onclick = e => { if (e.target === bg) closeForm(); }; document.body.appendChild(bg); }
  const descs = (S.boot.descriptions || []).filter(d => d.type === F.type).map(d => `<option value="${esc(d.description)}">`).join('');
  const cats = catsOf(F.type).filter(c => c.active || c.id === F.category_id);
  bg.innerHTML = `<div class="modal">
    <div class="mhead"><h3>${F.id ? 'עריכת' : 'רישום'} ${TYPE_LABEL[F.type]}</h3><button class="x" onclick="closeForm()">×</button></div>
    <div class="seg">${['expense', 'income', 'maaser'].map(t => `<button class="${t} ${F.type === t ? 'on' : ''}" onclick="fSet('type','${t}')">${TYPE_LABEL[t]}</button>`).join('')}</div>
    <input class="amount-in" id="fAmount" type="number" inputmode="decimal" step="0.01" placeholder="₪ 0" value="${esc(F.amount)}" oninput="F.amount=this.value" style="margin-top:12px">
    <label class="f">${F.type === 'maaser' ? 'למי (נמען)' : 'תיאור'}</label>
    <input id="fDesc" list="dl" value="${esc(F.description)}" oninput="F.description=this.value" placeholder="${F.type === 'maaser' ? 'שם המוסד / האדם' : F.type === 'income' ? 'מקור ההכנסה' : 'על מה'}"><datalist id="dl">${descs}</datalist>
    ${F.type !== 'maaser' ? `<label class="f">קטגוריה</label><div class="chips">${cats.map(c => `<button class="chip ${F.category_id === c.id ? 'on' : ''}" onclick="fSet('category_id',${c.id})">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <label class="f">תאריך</label><input type="date" value="${esc(F.date)}" onchange="F.date=this.value;$('#fHeb').textContent=hDate(this.value)+' '+hYearName(hparts(this.value).y)">
    <div class="heb" id="fHeb">${esc(hDate(F.date))} ${hYearName(hparts(F.date).y)}</div>
    <label class="f">אמצעי תשלום</label><div class="chips">${PAY_METHODS.map(p => `<button class="chip ${F.payment_method === p ? 'on' : ''}" onclick="fSet('payment_method','${p.replace(/'/g, "\\'")}')">${esc(p)}</button>`).join('')}</div>
    ${F.type === 'income' ? `<label class="check"><input type="checkbox" ${F.maaser_liable ? 'checked' : ''} onchange="F.maaser_liable=this.checked?1:0"> חייב במעשר</label>` : ''}
    <label class="f">הערה</label><textarea rows="2" oninput="F.note=this.value">${esc(F.note)}</textarea>
    <label class="f">קבלה</label>
    <div class="receipt-box">${receiptBoxInner()}</div>
    <div class="actions">
      <button class="btn" id="fSave" onclick="saveTx()">שמור</button>
      ${F.id ? `<button class="btn danger" style="flex:none" onclick="delTx()">מחק</button>` : ''}
    </div></div>`;
  if (!F.id) setTimeout(() => $('#fAmount')?.focus(), 50);
}
function receiptBoxInner() {
  if (F.receipt) return `${F.receipt.mime.startsWith('image/') ? `<img src="data:${F.receipt.mime};base64,${F.receipt.data}">` : `<span>📄 ${esc(F.receipt.name)}</span>`}<button class="btn sm danger" onclick="F.receipt=null;drawForm()">הסר</button>`;
  if (F.has_receipt && !F.removeReceipt) return `<button class="btn sm ghost" onclick="viewReceipt(${F.id})">📎 הצג קבלה</button><button class="btn sm danger" onclick="F.removeReceipt=true;drawForm()">מחק קבלה</button>${pickers()}`;
  return pickers();
}
function pickers() {
  return `<label class="btn sm ghost">📷 צלם<input type="file" accept="image/*" capture="environment" class="hidden" onchange="pickReceipt(this)"></label>
          <label class="btn sm ghost">📁 קובץ<input type="file" accept="image/*,application/pdf" class="hidden" onchange="pickReceipt(this)"></label>`;
}
function fSet(k, v) {
  F.amount = $('#fAmount')?.value ?? F.amount; F.description = $('#fDesc')?.value ?? F.description;
  if (k === 'type' && v !== F.type) { F.category_id = null; const c = catsOf(v).filter(c => c.active); if (c.length === 1) F.category_id = c[0].id; }
  if (k === 'category_id' && F.type === 'income') { const c = catsOf('income').find(c => c.id === v); if (c && !F.id) F.maaser_liable = c.maaser_liable; }
  F[k] = (k === 'payment_method' && F[k] === v) ? '' : v; drawForm();
}
function closeForm() { $('#mbg')?.remove(); F = null; }
async function pickReceipt(inp) {
  const f = inp.files[0]; if (!f) return;
  try {
    if (f.type.startsWith('image/')) F.receipt = await compressImage(f);
    else { if (f.size > 4.4e6) return toast('PDF גדול מדי (עד 4MB)'); F.receipt = { mime: f.type || 'application/pdf', name: f.name, data: await b64(f) }; }
    F.amount = $('#fAmount').value; F.description = $('#fDesc').value; drawForm();
  } catch (e) { toast('שגיאה בקובץ'); }
}
function b64(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); }); }
async function compressImage(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.72));
  return { mime: 'image/jpeg', name: file.name.replace(/\.\w+$/, '') + '.jpg', data: await b64(blob) };
}
async function saveTx() {
  F.amount = $('#fAmount').value; F.description = $('#fDesc').value;
  if (!(+F.amount > 0)) return toast('הכנס סכום');
  if (F.type !== 'maaser' && !F.category_id) return toast('בחר קטגוריה');
  const btn = $('#fSave'); btn.disabled = true; btn.textContent = 'שומר…';
  const body = { type: F.type, date: F.date, amount: +F.amount, category_id: F.type === 'maaser' ? null : F.category_id, description: F.description, payment_method: F.payment_method, note: F.note, maaser_liable: F.maaser_liable };
  try {
    let id = F.id;
    if (id) await api('/api/tx/' + id, { method: 'PUT', body }); else id = (await api('/api/tx', { method: 'POST', body })).id;
    if (F.receipt) await api('/api/receipt/' + id, { method: 'POST', body: F.receipt });
    else if (F.removeReceipt) await api('/api/receipt/' + id, { method: 'DELETE' });
    closeForm(); toast('נשמר'); await reloadAll();
  } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = 'שמור'; }
}
async function delTx() { if (!confirm('למחוק את התנועה?')) return; try { await api('/api/tx/' + F.id, { method: 'DELETE' }); closeForm(); toast('נמחק'); await reloadAll(); } catch (e) { toast(e.message); } }
async function viewReceipt(id) {
  try {
    toast('טוען קבלה…');
    const r = await api('/api/receipt/' + id);
    const bin = atob(r.data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u], { type: r.mime }));
    if (r.mime.startsWith('image/')) {
      const v = document.createElement('div'); v.className = 'modal-bg'; v.style.zIndex = 30; v.onclick = () => v.remove();
      v.innerHTML = `<div class="modal viewer"><div class="mhead"><h3>קבלה</h3><button class="x">×</button></div><img src="${url}"><a class="btn ghost sm" style="display:inline-block;margin-top:10px;text-decoration:none" href="${url}" download="${esc(r.name || 'receipt.jpg')}">הורדה</a></div>`;
      document.body.appendChild(v);
    } else window.open(url, '_blank');
  } catch (e) { toast(e.message); }
}

// ---------- הפעלה ----------
S.hy = hparts(todayIso()).y;
render();
if (S.token) reloadAll().catch(e => toast(e.message));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
